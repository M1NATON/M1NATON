<svg xmlns="http://www.w3.org/2000/svg" width="860" height="580" viewBox="0 0 860 580" font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace">
  <style>
    .t { opacity: 0; animation: tin .01s linear forwards; animation-delay: var(--d); }
    @keyframes tin { to { opacity: 1; } }
    .bl { opacity: 0; animation: bl .3s ease-out forwards; animation-delay: var(--d); }
    @keyframes bl { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .gl { opacity: 0; animation: tin .01s linear forwards; animation-delay: var(--d); }
    .floaty { animation: floaty 4.5s ease-in-out infinite; }
    @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .tw { transform-origin: center; transform-box: fill-box; animation: tw 2.4s ease-in-out infinite; animation-delay: var(--d); }
    @keyframes tw { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }
    .cur { animation: blink 1.1s step-end infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .banner { filter: drop-shadow(0 0 7px rgba(255, 126, 182, .35)); }
    @media (prefers-reduced-motion: reduce) {
      .t, .bl, .gl { animation: none; opacity: 1; }
      .floaty, .tw, .cur { animation: none; }
    }
  </style>

  <!-- window -->
  <rect x="8" y="8" width="844" height="564" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <rect x="8" y="8" width="844" height="38" rx="12" fill="#161b22"/>
  <rect x="8" y="34" width="844" height="12" fill="#161b22"/>
  <line x1="8" y1="46" x2="852" y2="46" stroke="#30363d" stroke-width="1"/>
  <circle cx="30" cy="27" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="27" r="6" fill="#febc2e"/>
  <circle cx="70" cy="27" r="6" fill="#28c840"/>
  <text x="430" y="31" text-anchor="middle" font-size="13" fill="#8b949e">m1naton@github: ~/waifu</text>

  <!-- cmd 1: whoami -->
  <text x="32" y="82" font-size="15" xml:space="preserve"><tspan fill="#7ee787">m1naton@github</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#79c0ff">~</tspan><tspan fill="#e6edf3">$ </tspan><tspan class="t" style="--d:.30s" fill="#e6edf3">w</tspan><tspan class="t" style="--d:.39s" fill="#e6edf3">h</tspan><tspan class="t" style="--d:.48s" fill="#e6edf3">o</tspan><tspan class="t" style="--d:.57s" fill="#e6edf3">a</tspan><tspan class="t" style="--d:.66s" fill="#e6edf3">m</tspan><tspan class="t" style="--d:.75s" fill="#e6edf3">i</tspan></text>

  <!-- banner: M1NATON -->
  <g class="banner" font-size="24" fill="#ff7eb6" xml:space="preserve">
    <text class="bl" style="--d:1.00s" x="84" y="116"> __  __   _   _  _     _    _____    ___    _  _ </text>
    <text class="bl" style="--d:1.12s" x="84" y="147">|  \/  | / | | \| |   /_\   |_   _|  / _ \ | \| |</text>
    <text class="bl" style="--d:1.24s" x="84" y="178">| |\/| | | | | .` |  / _ \    | |   | (_) | | .` |</text>
    <text class="bl" style="--d:1.36s" x="84" y="209">|_|  |_| |_| |_|\_| /_/ \_\   |_|    \___/  |_|\_|</text>
  </g>

  <!-- cmd 2: cat waifu.txt -->
  <text x="32" y="250" font-size="15" xml:space="preserve"><tspan class="t" style="--d:1.80s" fill="#7ee787">m1naton@github</tspan><tspan class="t" style="--d:1.80s" fill="#8b949e">:</tspan><tspan class="t" style="--d:1.80s" fill="#79c0ff">~</tspan><tspan class="t" style="--d:1.80s" fill="#e6edf3">$ </tspan><tspan class="t" style="--d:1.95s" fill="#e6edf3">c</tspan><tspan class="t" style="--d:2.03s" fill="#e6edf3">a</tspan><tspan class="t" style="--d:2.11s" fill="#e6edf3">t</tspan><tspan class="t" style="--d:2.19s" fill="#e6edf3"> </tspan><tspan class="t" style="--d:2.27s" fill="#e6edf3">w</tspan><tspan class="t" style="--d:2.35s" fill="#e6edf3">a</tspan><tspan class="t" style="--d:2.43s" fill="#e6edf3">i</tspan><tspan class="t" style="--d:2.51s" fill="#e6edf3">f</tspan><tspan class="t" style="--d:2.59s" fill="#e6edf3">u</tspan><tspan class="t" style="--d:2.67s" fill="#e6edf3">.</tspan><tspan class="t" style="--d:2.75s" fill="#e6edf3">t</tspan><tspan class="t" style="--d:2.83s" fill="#e6edf3">x</tspan><tspan class="t" style="--d:2.91s" fill="#e6edf3">t</tspan></text>

  <!-- waifu -->
  <g class="floaty">
    <g font-size="25" fill="#d2a8ff" xml:space="preserve">
      <text class="gl" style="--d:3.10s" x="90" y="300">⠐⣪⡑⣤⣶⣶⣶⣦⡔⣩⡒</text>
      <text class="gl" style="--d:3.19s" x="90" y="330">⢸⣯⣾⣿⢏⣿⣏⢿⣿⣮⣿</text>
      <text class="gl" style="--d:3.28s" x="90" y="360">⢸⣿⢸⡗⣶⠙⢱⡖⣿⢸⣿</text>
      <text class="gl" style="--d:3.37s" x="90" y="390">⢸⡿⠀⠳⣄⣐⣂⡴⠃⠸⣿</text>
      <text class="gl" style="--d:3.46s" x="90" y="420">⣾⠃⠀⡵⡔⠕⠕⡰⡅⠀⢻⡆</text>
      <text class="gl" style="--d:3.55s" x="90" y="450">⢹⡆⠘⢴⠙⠑⠉⢳⡱⠀⣾</text>
      <text class="gl" style="--d:3.64s" x="90" y="480">⠊⠀⠀⠈⡖⡖⡖⡎⠀⠀⠈⠂</text>
    </g>
    <text class="tw" style="--d:.0s" x="410" y="296" font-size="20" fill="#ff7eb6">✦</text>
    <text class="tw" style="--d:1.2s" x="452" y="470" font-size="16" fill="#ff7eb6">✦</text>
