  <text class="gl" style="--d:3.85s" x="490" y="370" font-size="19" fill="#ff7eb6">(◕‿◕)♡</text>
  <text class="gl" style="--d:3.95s" x="490" y="402" font-size="14" fill="#8b949e">nya~</text>

  <!-- final prompt + cursor -->
  <text x="32" y="536" font-size="15" xml:space="preserve"><tspan class="t" style="--d:4.15s" fill="#7ee787">m1naton@github</tspan><tspan class="t" style="--d:4.15s" fill="#8b949e">:</tspan><tspan class="t" style="--d:4.15s" fill="#79c0ff">~</tspan><tspan class="t" style="--d:4.15s" fill="#e6edf3">$ </tspan></text>
  <rect class="cur" x="196" y="521" width="9" height="19" fill="#e6edf3"/>
</svg>
