  <style>
    .t { opacity: 0; animation: tin .01s linear forwards; animation-delay: var(--d); }
    @keyframes tin { to { opacity: 1; } }
    .gl { opacity: 0; animation: tin .01s linear forwards; animation-delay: var(--d); }
    .floaty { animation: floaty 4.5s ease-in-out infinite; }
    @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .tw { transform-origin: center; transform-box: fill-box; animation: tw 2.4s ease-in-out infinite; animation-delay: var(--d); }
    @keyframes tw { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }
    .banner { animation: glow 3s ease-in-out infinite; }
    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(255, 126, 182, .25)); }
      50% { filter: drop-shadow(0 0 11px rgba(255, 126, 182, .5)); }
    }
    .cur { opacity: 0; animation: tin .01s linear forwards, blink 1.1s step-end infinite; animation-delay: var(--d), var(--d); }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .t, .gl, .cur { animation: none; opacity: 1; }
      .floaty, .tw, .banner { animation: none; }
    }
  </style>

